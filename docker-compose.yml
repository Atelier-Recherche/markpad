services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    ports:
      - "1234:1234"
    volumes:
      # SQLite (magic tokens, utilisateurs, index partages) — sans volume, un recreate conteneur efface la base.
      - markpad_data:/app/data
    depends_on:
      - redis

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_SERVER_BASE_URL: ${PUBLIC_SERVER_URL:-http://localhost:1234}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server

volumes:
  redis_data:
  markpad_data:
