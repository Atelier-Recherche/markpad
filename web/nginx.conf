# En production, une seule URL publique (PUBLIC_SERVER_URL = PUBLIC_WEB_URL) : le navigateur
# parle au même hôte pour le SPA et l’API. On proxifie l’API vers le service Docker `server`.

upstream markpad_server {
  server server:1234;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- API Express + WebSocket Yjs (même origine que le front) ---
  location /healthz {
    proxy_pass http://markpad_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Ne pas matcher /auth/verify : c’est la route React (SPA). Seules les vraies routes API sous /auth/…
  location /auth/magic/ {
    proxy_pass http://markpad_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /auth/public-config {
    proxy_pass http://markpad_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /sessions {
    proxy_pass http://markpad_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /me/ {
    proxy_pass http://markpad_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Page React /admin (rechargement F5) — ne pas envoyer vers Express (sinon « Cannot GET /admin/ »).
  location ~ ^/admin/?$ {
    try_files /index.html =404;
  }

  # API REST admin uniquement (/admin/shares, /users, /settings, /sessions/…)
  location ~ ^/admin/(shares|users|settings|sessions)(/|$) {
    proxy_pass http://markpad_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws/ {
    proxy_pass http://markpad_server;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  location / {
    try_files $uri /index.html;
  }
}
